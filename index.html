<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusTasks — Simple Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>FocusTasks</h1>
      <p class="subtitle">Stay organized. Get things done.</p>
    </header>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <footer class="stats">
      <span id="count">0 tasks left</span>
      <button id="clear-completed">Clear completed</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
